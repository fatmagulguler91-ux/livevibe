name: Build Android APK

on:
  push:
    branches: [ "ana", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Indir
      uses: actions/checkout@v4

    - name: Java Kur (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Gradle Wrapper Oluştur ve Detaylı Derle
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: uygulama-apk
        path: "**/*.apk"
